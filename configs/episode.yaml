run:
  seed: 7
  out_dir: runs

sim:
  mu: 0.0              # unused (kept for compatibility)
  dt: 1.0              # seconds
  steps: 400
  decision_period: 5
  intercept_radius_km: 0.05   # unused by world; intercept handled in run_episode try_intercepts
  max_burns_per_agent: 500    # allow lots of steering updates
  dv_budget_kms: 20.0          # "fuel" budget: total delta-v magnitude available
  burn_dv_kms: 0.12           # max delta-v we can spend per steering update
  burn_cooldown_s: 0.0

scenario:
  n_agents: 6
  n_targets: 6
  ref_orbit_radius_km: 80.0      # interpreted as battlespace half-width (km)
  agent_pos_sigma_km: 1.0
  agent_vel_sigma_kms: 0.01
  target_pos_sigma_km: 1.0
  target_vel_sigma_kms: 0.01

sensor:
  sigma_range_km: 0.0
  sigma_bearing_rad: 0.0

tracking:
  enabled: false
  q_pos: 0.01
  q_vel: 0.01
  r_range: 0.5
  r_bearing: 0.01

association:
  enabled: false
  gate_mahalanobis2: 9.21

planner:
  type: hungarian_baseline
  max_pairs_per_agent: 6
  weights:
    w_range: 1.0
    w_rel_vel: 0.2
    w_tgo: 2.0
    w_budget: 200.0
    eps_speed: 0.001

engagement:
  commit_radius_km: 50.0
  kill_radius_km: 1.0
  v_close_min_kms: 0.0
